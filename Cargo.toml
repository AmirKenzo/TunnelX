[package]
name = "tunnelx"
version = "0.2.9"
edition = "2021"

[[bin]]
name = "tunnelx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bincode = "1.3"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
tokio-tungstenite = "0.24"
bytes = "1"
rand = "0.8"
yamux = "0.14"
tokio-util = { version = "0.7", features = ["compat"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
