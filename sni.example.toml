log_level = "info"

# Only connections whose SNI is in allowed_sni are forwarded; everything else is dropped.
[[forward]]
name = "cf-relay"
listen = "0.0.0.0:443"
allowed_sni = [
    "ak.ir",
    "*.sni.ir",
]
targets = [
    "104.16.0.1:443",
    "104.17.0.1:443",
    "172.67.0.1:443",
]

# No allowed_sni: every connection (any SNI, or non-TLS) is forwarded to a random target.
[[forward]]
name = "cf-open"
listen = "0.0.0.0:8443"
targets = [
    "104.16.0.1:443",
    "104.17.0.1:443",
]
# Optional per-rule connection settings (any [[forward]] rule; defaults shown):
#   idle_timeout_secs = 300    # close after this long with no traffic; 0 disables
#   keepalive_secs = 60        # TCP keepalive idle time on both sides; 0 disables
#   max_connections = 100000   # concurrent connections on this rule; 0 = unlimited
#   source_ip = "inbound"      # dial the target from the local IP the client connected to
#                              # (or a fixed IP, e.g. "203.0.113.10"); unset = OS default
